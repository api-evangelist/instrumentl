aid: instrumentl
name: Instrumentl
description: >-
  Instrumentl is the all-in-one grant management platform for nonprofits and
  grant-writing consultants, helping 5,500+ organizations discover, apply for,
  and manage grants across the full funding lifecycle. Its Discover capability
  uses AI-powered matching across 35,000+ active grant opportunities; Apply
  provides AI-assisted proposal drafting trained on an organization's own
  winning proposals and funder insights; and Manage handles post-award
  administration, spend-down tracking, compliance monitoring, and deadline
  management. Instrumentl maintains a grants database and a 450,000+ funder
  Foundation Directory built from IRS Form 990 filings, and exposes an
  authenticated remote MCP server (mcp.instrumentl.com) for agent access.
